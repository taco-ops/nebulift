# MLflow tracking server.
#
# Phase 1b-2: switched from python:3.11-slim + runtime `pip install` to a
# baked image at ghcr.io/taco-ops/nebulift-mlflow (built by the
# image_build_mlflow CircleCI job from docker/mlflow/Dockerfile).
# Benefits over the Phase 1a runtime-install shim:
#   - Eliminates ~20-30s pod cold-start latency.
#   - Removes the PyPI runtime dependency (no install on every restart).
#   - Allows readOnlyRootFilesystem: true since no package writes are needed.
#   - Pins mlflow + boto3 deterministically in the image.
# The image still bundles boto3 because the upstream ghcr.io/mlflow/mlflow
# image does not, and our MinIO-backed --serve-artifacts mode needs it.
#
# Storage:
#   - SQLite metadata DB on NFS at /mlflow/db. Single-writer enforced by
#     replicas=1 + Recreate strategy.
#   - Artifact bytes go to MinIO via --serve-artifacts proxy mode, so clients
#     only need MLflow's HTTP endpoint, not S3 creds.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: nebulift-platform
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/component: tracking-server
    app.kubernetes.io/part-of: nebulift
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
        app.kubernetes.io/component: tracking-server
        app.kubernetes.io/part-of: nebulift
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: [arm64]
      tolerations:
        - key: kubernetes.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mlflow
          # Baked image; rebuilt by CircleCI image_build_mlflow on every push
          # to main and retagged as :latest. imagePullPolicy: Always picks up
          # the new digest on every pod restart (Recreate strategy makes that
          # the only refresh path for this single-replica Deployment).
          image: ghcr.io/taco-ops/nebulift-mlflow:latest
          imagePullPolicy: Always
          # ENTRYPOINT in the image is `mlflow`, so args here are subcommand
          # + flags only. $(VAR) syntax is expanded by kubelet from envFrom +
          # env before exec, so the running process sees fully-resolved args.
          args:
            - server
            - --backend-store-uri
            - $(MLFLOW_BACKEND_STORE_URI)
            - --artifacts-destination
            - $(MLFLOW_ARTIFACTS_DESTINATION)
            - --serve-artifacts
            - --host
            - $(MLFLOW_HOST)
            - --port
            - $(MLFLOW_PORT)
          env:
            # AWS_* env vars are consumed by boto3 (which MLflow uses to talk
            # to MinIO's S3 API). The MinIO root credentials double as the S3
            # creds for the mlflow-artifacts bucket.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: accesskey
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: secretkey
          envFrom:
            - configMapRef:
                name: mlflow-config
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            # Cold start is now image pull + process start (no pip install),
            # so the previous 45s grace can come down. Keep some headroom for
            # ARM64 NFS mount + SQLite WAL recovery on first boot.
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 1
          securityContext:
            allowPrivilegeEscalation: false
            # Baked image means no runtime pip writes -> root FS can be RO.
            # Writable paths needed at runtime: /mlflow/db (NFS) and /tmp
            # (emptyDir) for SQLite WAL/journal scratch.
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: db
              mountPath: /mlflow/db
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: db
          nfs:
            server: 10.42.0.22
            path: /exports/cluster-storage/nebulift-platform/mlflow/db
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
