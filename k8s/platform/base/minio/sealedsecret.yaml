# Placeholder SealedSecret for MinIO root credentials.
#
# DO NOT commit unsealed values. The `encryptedData` blobs below are intentional
# placeholders that will FAIL to decrypt. Before first deploy, run:
#
#   scripts/seal-minio-secret.sh
#
# That script:
#   1. Prompts (or accepts via env vars) for MINIO_ROOT_USER and MINIO_ROOT_PASSWORD.
#   2. Calls `kubeseal` against the cluster's sealed-secrets controller.
#   3. Rewrites this file in-place with real sealed payloads.
#
# Keys consumed by the MinIO Deployment:
#   - accesskey -> $MINIO_ROOT_USER
#   - secretkey -> $MINIO_ROOT_PASSWORD
#
# MLflow also reads the same secret as AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# via a key projection in its Deployment env spec.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: minio-root
  namespace: nebulift-platform
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: object-storage
    app.kubernetes.io/part-of: nebulift
spec:
  encryptedData:
    accesskey: PLACEHOLDER_RUN_seal-minio-secret.sh_BEFORE_DEPLOY
    secretkey: PLACEHOLDER_RUN_seal-minio-secret.sh_BEFORE_DEPLOY
  template:
    metadata:
      name: minio-root
      namespace: nebulift-platform
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/component: object-storage
        app.kubernetes.io/part-of: nebulift
    type: Opaque
