# Ingresses exposing MinIO via k3s' bundled Traefik v2.x.
#
# Two routes:
#   - minio.nebulift.local -> port 9001 (web console UI)
#   - s3.nebulift.local    -> port 9000 (S3 API; MLflow + boto3 clients hit this)
#
# Keeping them on distinct hostnames avoids path-rewrite headaches and lets the
# S3 API speak its own protocol on the root path.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-console
  namespace: nebulift-platform
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true"
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: object-storage
    app.kubernetes.io/part-of: nebulift
spec:
  rules:
    - host: minio.nebulift.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-s3
  namespace: nebulift-platform
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true"
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: object-storage
    app.kubernetes.io/part-of: nebulift
spec:
  rules:
    - host: s3.nebulift.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000
