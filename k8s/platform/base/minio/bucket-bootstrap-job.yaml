# One-shot Job that provisions the mlflow-artifacts bucket in MinIO.
#
# Sync wave 2 places this after MinIO (wave 1) and before MLflow (wave 3) so
# that MLflow's first artifact write does not fail with "NoSuchBucket".
#
# Idempotent via `mc mb --ignore-existing`. Argo CD will re-run it on every
# sync only if a manifest change is detected; otherwise the Job stays
# completed and is cleaned up by ttlSecondsAfterFinished.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-bootstrap
  namespace: nebulift-platform
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
    app.kubernetes.io/name: minio-bucket-bootstrap
    app.kubernetes.io/part-of: nebulift
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-bucket-bootstrap
        app.kubernetes.io/part-of: nebulift
    spec:
      restartPolicy: OnFailure
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: [arm64]
      tolerations:
        - key: kubernetes.io/arch
          operator: Equal
          value: arm64
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "Waiting for MinIO to be reachable..."
              for i in $(seq 1 60); do
                if mc alias set local "http://minio.nebulift-platform.svc.cluster.local:9000" \
                     "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1; then
                  echo "MinIO ready after ${i}s"
                  break
                fi
                sleep 1
              done
              mc alias set local "http://minio.nebulift-platform.svc.cluster.local:9000" \
                "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}"
              mc mb --ignore-existing local/mlflow-artifacts
              mc ls local/
              echo "Bucket bootstrap complete."
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: accesskey
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: secretkey
            - name: HOME
              value: /tmp
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 128Mi
              cpu: 200m
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
