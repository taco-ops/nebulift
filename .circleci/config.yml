version: 2.1

parameters:
  run-training-pipeline:
    type: boolean
    default: false
  python-version:
    type: string
    default: "3.12"

executors:
  python:
    docker:
      - image: cimg/python:<< pipeline.parameters.python-version >>
    environment:
      UV_CACHE_DIR: /tmp/.uv-cache

commands:
  install_uv:
    description: Install uv package manager
    steps:
      - run:
          name: Install uv
          command: python -m pip install --upgrade pip uv

  restore_uv_cache:
    description: Restore uv dependency cache
    steps:
      - restore_cache:
          keys:
            - uv-v1-{{ arch }}-{{ checksum "uv.lock" }}
            - uv-v1-{{ arch }}-

  save_uv_cache:
    description: Save uv dependency cache
    steps:
      - run:
          name: Prune uv cache
          command: uv cache prune --ci
      - save_cache:
          key: uv-v1-{{ arch }}-{{ checksum "uv.lock" }}
          paths:
            - /tmp/.uv-cache

  install_project:
    description: Install Nebulift with development dependencies
    steps:
      - install_uv
      - restore_uv_cache
      - run:
          name: Install dependencies
          command: uv sync --all-extras --dev

jobs:
  lint_and_typecheck:
    executor: python
    steps:
      - checkout
      - install_project
      - run:
          name: Check formatting
          command: uv run black --check --diff .
      - run:
          name: Lint Python code
          command: uv run flake8 nebulift/ tests/
      - run:
          name: Type check package
          command: uv run mypy nebulift/ --ignore-missing-imports
      - save_uv_cache

  test_suite:
    executor: python
    steps:
      - checkout
      - install_project
      - run:
          name: Run pytest suite
          command: |
            mkdir -p test-results/pytest
            uv run pytest tests/ -v --cov=nebulift --cov-report=xml --cov-report=term-missing --junitxml=test-results/pytest/results.xml
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: coverage.xml
      - save_uv_cache

  local_workflow_readiness:
    executor: python
    steps:
      - checkout
      - install_project
      - run:
          name: Validate model persistence
          command: uv run python test_model_persistence.py
      - run:
          name: Validate local workflow CLI surface
          command: |
            uv run nebulift --help
            uv run python -m nebulift --help
            uv run python -m nebulift.cli analyze --help
            uv run python -m nebulift.cli batch --help
            uv run python -m nebulift.cli review --help
            uv run python -m nebulift.cli evaluate-manifest --help
            uv run python -m nebulift.cli calibrate-thresholds --help
            uv run python -m nebulift.cli export-curated --help
            uv run python -m nebulift.cli train --help
            uv run python -m nebulift.cli train-from-fits --help
            uv run python -m nebulift.cli train-from-manifest --help
            uv run python -m nebulift.cli register-model --help
            uv run python -m nebulift.cli promote-model --help
            uv run python -m nebulift.cli list-models --help
      - run:
          name: Run local workflow tests
          command: uv run pytest tests/test_cli.py -v
      - save_uv_cache

  package_build:
    executor: python
    steps:
      - checkout
      - install_project
      - run:
          name: Build package distributions
          command: uv build
      - run:
          name: Validate package metadata
          command: uv run python -m twine check dist/*
      - store_artifacts:
          path: dist
      - save_uv_cache

  full_training_pipeline:
    executor: python
    resource_class: large
    steps:
      - checkout
      - install_project
      - run:
          name: Run FITS training pipeline smoke test
          command: uv run python test_training_pipeline.py
          no_output_timeout: 20m
      - save_uv_cache

  image_build:
    machine:
      image: ubuntu-2404:current
      docker_layer_caching: true
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Ensure Docker daemon is running
          command: |
            # ubuntu-2404:current has Docker preinstalled but does not always
            # auto-start the daemon before the first job step runs.
            sudo systemctl enable --now docker.service 2>/dev/null || sudo service docker start || true
            for i in $(seq 1 30); do
              if docker info >/dev/null 2>&1; then
                echo "Docker daemon ready after ${i}s"
                docker version
                exit 0
              fi
              sleep 1
            done
            echo "Docker daemon failed to start within 30s" >&2
            sudo systemctl status docker.service --no-pager || true
            exit 1
      - run:
          name: Set up QEMU for multi-arch emulation
          command: docker run --privileged --rm tonistiigi/binfmt:latest --install all
      - run:
          name: Create buildx builder
          command: |
            docker buildx create --use --name nebulift-builder --driver docker-container
            docker buildx inspect --bootstrap
      - run:
          name: Authenticate to GHCR
          command: |
            # GHCR_USERNAME is optional; falls back to the CircleCI project
            # username (taco-ops). GHCR accepts the org name as the docker
            # login user as long as GHCR_TOKEN is a PAT with write:packages.
            GHCR_USER="${GHCR_USERNAME:-$CIRCLE_PROJECT_USERNAME}"
            if [ -z "$GHCR_TOKEN" ]; then
              echo "ERROR: GHCR_TOKEN is not set; attach the 'ghcr' context to this job." >&2
              exit 1
            fi
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - run:
          name: Build and push multi-arch image
          command: |
            set -euo pipefail
            # OCI repository names must be lowercase; CircleCI preserves the
            # GitHub display case (e.g. "Taco-Ops/Nebulift").
            IMAGE_PATH=$(echo "${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}" | tr '[:upper:]' '[:lower:]')
            IMAGE="ghcr.io/${IMAGE_PATH}"
            SHORT_SHA="${CIRCLE_SHA1:0:7}"
            BRANCH_TAG=$(echo "${CIRCLE_BRANCH//\//-}" | tr '[:upper:]' '[:lower:]')
            TAG_ARGS=(--tag "${IMAGE}:${SHORT_SHA}" --tag "${IMAGE}:${BRANCH_TAG}")
            if [ "$CIRCLE_BRANCH" = "main" ]; then
              TAG_ARGS+=(--tag "${IMAGE}:latest")
            fi
            docker buildx build \
              --platform linux/arm64,linux/amd64 \
              "${TAG_ARGS[@]}" \
              --cache-from "type=registry,ref=${IMAGE}:buildcache" \
              --cache-to "type=registry,ref=${IMAGE}:buildcache,mode=max" \
              --push \
              .

  image_build_mlflow:
    # Builds the baked MLflow tracking server image consumed by the
    # nebulift-platform Deployment (k8s/platform/base/mlflow). Independent of
    # the trainer image build because the two share no source code and we
    # want platform image rebuilds even when trainer tests are skipped.
    machine:
      image: ubuntu-2404:current
      docker_layer_caching: true
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Ensure Docker daemon is running
          command: |
            sudo systemctl enable --now docker.service 2>/dev/null || sudo service docker start || true
            for i in $(seq 1 30); do
              if docker info >/dev/null 2>&1; then
                echo "Docker daemon ready after ${i}s"
                docker version
                exit 0
              fi
              sleep 1
            done
            echo "Docker daemon failed to start within 30s" >&2
            sudo systemctl status docker.service --no-pager || true
            exit 1
      - run:
          name: Set up QEMU for multi-arch emulation
          command: docker run --privileged --rm tonistiigi/binfmt:latest --install all
      - run:
          name: Create buildx builder
          command: |
            docker buildx create --use --name nebulift-mlflow-builder --driver docker-container
            docker buildx inspect --bootstrap
      - run:
          name: Authenticate to GHCR
          command: |
            GHCR_USER="${GHCR_USERNAME:-$CIRCLE_PROJECT_USERNAME}"
            if [ -z "$GHCR_TOKEN" ]; then
              echo "ERROR: GHCR_TOKEN is not set; attach the 'ghcr' context to this job." >&2
              exit 1
            fi
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - run:
          name: Build and push baked MLflow tracking server image
          command: |
            set -euo pipefail
            # OCI repository names must be lowercase. The "-mlflow" suffix
            # keeps the platform image in its own GHCR package, separate from
            # the trainer image at ghcr.io/<owner>/nebulift.
            IMAGE_PATH=$(echo "${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}-mlflow" | tr '[:upper:]' '[:lower:]')
            IMAGE="ghcr.io/${IMAGE_PATH}"
            SHORT_SHA="${CIRCLE_SHA1:0:7}"
            BRANCH_TAG=$(echo "${CIRCLE_BRANCH//\//-}" | tr '[:upper:]' '[:lower:]')
            TAG_ARGS=(--tag "${IMAGE}:${SHORT_SHA}" --tag "${IMAGE}:${BRANCH_TAG}")
            if [ "$CIRCLE_BRANCH" = "main" ]; then
              TAG_ARGS+=(--tag "${IMAGE}:latest")
            fi
            docker buildx build \
              --platform linux/arm64,linux/amd64 \
              "${TAG_ARGS[@]}" \
              --cache-from "type=registry,ref=${IMAGE}:buildcache" \
              --cache-to "type=registry,ref=${IMAGE}:buildcache,mode=max" \
              --file docker/mlflow/Dockerfile \
              --push \
              docker/mlflow

workflows:
  ci:
    jobs:
      - lint_and_typecheck
      - test_suite:
          requires:
            - lint_and_typecheck
      - local_workflow_readiness:
          requires:
            - lint_and_typecheck
      - package_build:
          requires:
            - lint_and_typecheck
      - image_build:
          requires:
            - test_suite
          context:
            - ghcr
      - image_build_mlflow:
          # Only gated on the fast lint job because the MLflow server image
          # shares no source with the trainer/test suite.
          requires:
            - lint_and_typecheck
          context:
            - ghcr

  training_pipeline:
    when: << pipeline.parameters.run-training-pipeline >>
    jobs:
      - full_training_pipeline
